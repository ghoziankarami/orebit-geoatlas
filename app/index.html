<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orebit GeoAtlas — Peta Geologi Indonesia</title>
  <meta name="description" content="Peta geologi multi-sumber Indonesia. Skala dan cakupan mengikuti sumber data yang tersedia." />
  <link rel="canonical" href="https://atlas.orebit.id/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://atlas.orebit.id/" />
  <meta property="og:site_name" content="Orebit GeoAtlas" />
  <meta property="og:title" content="Orebit GeoAtlas — Peta Geologi Indonesia" />
  <meta property="og:description" content="Jelajahi formasi, umur, dan litologi Indonesia langsung di browser." />
  <meta property="og:image" content="https://atlas.orebit.id/og-geoatlas.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Orebit GeoAtlas, peta geologi interaktif Indonesia dengan pilihan umur, litologi, dan medan 3D." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Orebit GeoAtlas — Peta Geologi Indonesia" />
  <meta name="twitter:description" content="Jelajahi formasi, umur, dan litologi Indonesia langsung di browser." />
  <meta name="twitter:image" content="https://atlas.orebit.id/og-geoatlas.png" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="map" aria-label="Peta geologi"></div>
  <div id="hoverTip" class="hover-tip" role="tooltip" hidden></div>

  <aside class="panel" id="panel" aria-label="Kontrol peta">
    <button class="sheet-handle" id="sheetHandle" type="button" aria-expanded="true"><span></span></button>
    <header class="brand">
      <div>
        <h1>GeoAtlas</h1>
        <p class="tagline" id="t-tagline"></p>
        <p class="sheet-hint" id="sheetHint"></p>
        <a class="brand-credit" href="https://orebit.id" target="_blank" rel="noopener">orebit.id <span aria-hidden="true">↗</span></a>
      </div>
      <div class="brand-actions">
        <button id="panelToggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panelControls" title="Minimize control panel">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 L5 9 L11 15 M5 9 H16" /></svg>
        </button>
        <button class="lang" id="langBtn" type="button"></button>
      </div>
    </header>

    <form class="search" id="searchForm" role="search">
      <label class="sr-only" for="searchInput" id="t-searchLabel"></label>
      <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" />
      <div id="searchResults" class="search-results" hidden></div>
    </form>

    <div class="panel-controls" id="panelControls">
    <section class="block">
      <h2 id="t-colorBy"></h2>
      <div class="segmented" role="radiogroup" id="modeGroup">
        <button type="button" role="radio" data-mode="age" id="t-modeAge"></button>
        <button type="button" role="radio" data-mode="lith" id="t-modeLith"></button>
      </div>
    </section>

    <section class="block">
      <h2 id="t-ageFilter"></h2>
      <div class="age-range">
        <div class="age-track"></div>
        <div class="age-fill" id="ageFill"></div>
        <input type="range" id="ageMin" min="0" max="600" step="1" aria-labelledby="t-ageFilter" />
        <input type="range" id="ageMax" min="0" max="600" step="1" aria-labelledby="t-ageFilter" />
      </div>
      <p class="age-readout" id="ageReadout"></p>
    </section>

    <section class="block">
      <label class="toggle"><input type="checkbox" id="linesToggle" checked /> <span id="t-lines"></span></label>
    </section>

    <section class="block opacity-block">
      <div class="control-heading"><h2 id="opacityLabel"></h2><output id="opacityValue" for="geologyOpacity">75%</output></div>
      <input type="range" id="geologyOpacity" min="15" max="100" step="5" value="75" aria-labelledby="opacityLabel" />
      <p class="opacity-hint" id="opacityHint"></p>
    </section>

    <section class="block legend" id="legend" aria-live="polite"></section>

    <footer class="panel-foot">
      <p id="t-disclaimer"></p>
      <div class="foot-links">
        <button class="link-btn" id="aboutBtn" type="button"></button>
        <a class="link-btn" id="githubLink" href="https://github.com/ghoziankarami/orebit-geoatlas" target="_blank" rel="noopener"></a>
      </div>
    </footer>
    </div>
  </aside>

  <aside class="detail" id="detail" hidden aria-live="polite">
    <button class="close" id="detailClose" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13" /></svg>
    </button>
    <div id="detailBody"></div>
    <div class="detail-actions" id="detailActions">
      <a class="btn primary" id="detailSource" target="_blank" rel="noopener" hidden></a>
      <button class="btn" id="detailFocus" type="button"></button>
      <button class="btn" id="detailCopy" type="button"></button>
    </div>
  </aside>

  <div class="map-ctrls" id="mapControls" aria-label="Navigasi peta">
    <div class="ctrl-group">
      <button type="button" id="zoomIn" class="ctrl">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 V14 M2 8 H14" /></svg>
      </button>
      <button type="button" id="zoomOut" class="ctrl">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8 H14" /></svg>
      </button>
    </div>
    <button type="button" id="locateBtn" class="ctrl solo">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="5" /><path d="M9 1 V4 M9 14 V17 M1 9 H4 M14 9 H17" /></svg>
    </button>
    <div class="view-group" role="group" aria-label="Tampilan peta">
      <button type="button" id="planView" aria-pressed="true">2D</button>
      <button type="button" id="terrainView" aria-pressed="false">3D</button>
    </div>
    <div class="rotation-group" role="group" aria-label="Orientasi medan">
      <button type="button" id="tiltUp" aria-label="Tambah kemiringan kamera" title="Tilt up">∧</button>
      <button type="button" id="rotateLeft" aria-label="Putar peta ke kiri" title="Rotate left">↺</button>
      <button type="button" id="resetNorth" aria-label="Kembalikan arah utara" title="Reset north">N</button>
      <button type="button" id="rotateRight" aria-label="Putar peta ke kanan" title="Rotate right">↻</button>
      <button type="button" id="tiltDown" aria-label="Kurangi kemiringan kamera" title="Tilt down">∨</button>
    </div>
    <details class="tools-menu" id="toolsMenu">
      <summary id="toolsSummary" aria-label="Terrain and export tools">Tools</summary>
      <div class="tools-popover">
        <button type="button" id="topographyToggle" class="ctrl topo-toggle" aria-pressed="false"></button>
        <div class="export-group" role="group" aria-label="Export peta">
          <button type="button" id="exportPNG" class="export-btn">PNG</button>
          <button type="button" id="exportPDF" class="export-btn">PDF</button>
        </div>
      </div>
    </details>
  </div>

  <div class="map-foot">
    <div id="scaleSlot"></div>
    <p class="attrib">
      <a href="https://macrostrat.org" target="_blank" rel="noopener">Macrostrat</a> (CC-BY 4.0),
      <a href="https://geologi.esdm.go.id/geomap" target="_blank" rel="noopener">Pusat Survei Geologi</a>,
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
      <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>
      · © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>
      <span id="terrainAttribution" hidden> · <a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">Terrain © Mapterhorn</a></span>
    </p>
  </div>

  <p class="toast" id="toast" role="status" hidden></p>

  <dialog class="about" id="aboutDialog" aria-labelledby="aboutTitle">
    <div class="about-body" id="aboutBody"></div>
    <form method="dialog"><button class="btn primary" id="aboutClose" type="submit"></button></form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
