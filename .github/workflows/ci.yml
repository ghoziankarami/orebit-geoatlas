name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas
      - run: python pipeline/validate_reference.py
      - run: python -m unittest discover -s pipeline -p 'test_*.py'
      - name: Probe ESDM metadata availability
        continue-on-error: true
        run: |
          for url in \
            'https://geoportal.esdm.go.id/gis4/rest/services/BGS_PM/Geologi_Litologi/MapServer/0?f=pjson' \
            'https://geoportal.esdm.go.id/gis4/rest/services/bgl_bgs_pm/Geologi_Geostruktur/MapServer?f=pjson'; do
            echo "Checking $url"
            curl --location --silent --show-error --max-time 20 \
              --output /tmp/esdm-response --write-out 'HTTP %{http_code}\n' "$url" || true
            head -c 400 /tmp/esdm-response || true
            echo
          done
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
