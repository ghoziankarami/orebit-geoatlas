name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas
      - run: python pipeline/validate_reference.py
      - run: python -m unittest discover -s pipeline -p 'test_*.py'
      - name: Probe ESDM metadata availability
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          root = "https://geoportal.esdm.go.id/gis4/rest/services/"
          paths = [
              "BGS_PM?f=pjson",
              "BGS_PM/Geologi_Litologi/MapServer?f=pjson",
              "BGS_PM/Geologi_Geostruktur/MapServer?f=pjson",
              "BGS_PM/Patahan_Aktif_Skala_Besar/MapServer?f=pjson",
              "BGS_PM/Patahan_Aktif_Skala_Kecil/MapServer?f=pjson",
              "BGS_PM/Patahan_Aktif_Skala_Besar/MapServer/0?f=pjson",
              "BGS_PM/Patahan_Aktif_Skala_Kecil/MapServer/0?f=pjson",
              "BGS_PM/Patahan_Aktif_Skala_Besar/MapServer/0/query?"
              + urllib.parse.urlencode({"where": "1=1", "returnCountOnly": "true", "f": "json"}),
              "BGS_PM/Patahan_Aktif_Skala_Kecil/MapServer/0/query?"
              + urllib.parse.urlencode({"where": "1=1", "returnCountOnly": "true", "f": "json"}),
              "BGS_PM/Geologi_Litologi/MapServer/0/query?"
              + urllib.parse.urlencode({"where": "1=1", "returnCountOnly": "true", "f": "json"}),
          ]
          for path in paths:
              try:
                  with urllib.request.urlopen(root + path, timeout=25) as response:
                      data = json.load(response)
                  print(path, json.dumps({
                      "error": data.get("error"), "services": data.get("services"),
                      "layers": data.get("layers"), "count": data.get("count"),
                      "geometryType": data.get("geometryType"),
                      "fields": [f.get("name") for f in data.get("fields", [])],
                  }, ensure_ascii=False)[:2500])
              except Exception as exc:
                  print(path, type(exc).__name__, str(exc))
          PY
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
